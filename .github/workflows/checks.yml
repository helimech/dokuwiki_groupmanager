name: Group Manager checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: |
          node --check script.js
          node --check audit.js
      - name: PHP smoke tests
        run: |
          php _test/smoke.php
          php _test/acl_explorer.php
          php _test/access_audit.php
      - name: Navigation smoke tests
        run: node _test/navigation.js
